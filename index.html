<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="X楽ちん検索"><title>X楽ちん検索</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif;color:#182235;background:#f4f6fa}*{box-sizing:border-box}body{margin:0}main{max-width:560px;margin:auto;padding:22px 17px 65px}h1{font-size:25px;margin:0}p{color:#64748b;font-size:13px;line-height:1.6}.panel{background:white;border-radius:20px;padding:18px;margin-top:15px;box-shadow:0 5px 24px #15213b0a}label{display:block;font-size:13px;font-weight:700;margin:14px 0 7px}input,select,button{font:inherit}input,select{width:100%;padding:13px;border:1px solid #d8dfeb;border-radius:12px;background:white;font-size:16px}button{border:0;border-radius:12px;padding:12px 14px;font-weight:700;cursor:pointer}.primary{background:#111827;color:white;width:100%;margin-top:18px;padding:16px}.secondary{background:#e9eef6;color:#1e293b}.row{display:flex;gap:8px;align-items:center}.row>*{min-width:0}.row input{flex:1}.chips{display:flex;gap:8px;flex-wrap:wrap}.chip{background:#edf2f8;font-size:13px;padding:9px 12px}.chip.active{background:#111827;color:white}.saved{display:flex;gap:7px;flex-wrap:wrap}.saved button{font-size:13px;background:#eaf1fb}.muted{color:#64748b;font-size:12px}details{margin-top:12px}summary{cursor:pointer;font-weight:700}code{display:block;white-space:pre-wrap;overflow-wrap:anywhere;background:#f1f5f9;padding:10px;border-radius:9px;font-size:12px}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.small{font-size:12px;padding:9px}.danger{color:#b91c1c;background:#fee2e2}.check{display:flex;align-items:center;gap:8px}.check input{width:auto}footer{margin-top:20px}</style></head><body><main><h1>🔍 X楽ちん検索</h1><p>お気に入りのアカウントから、見たいポストをサクッと探せます。</p><section class="panel"><strong>お気に入りアカウント</strong><div id="accounts" class="chips" style="margin-top:12px"></div><label for="handle">検索するアカウント（@なしでもOK）</label><div class="row"><input id="handle" placeholder="例：username" autocomplete="off" autocapitalize="none"><button id="add" class="secondary" type="button">☆ 登録</button></div><p class="muted">登録済みアカウントは長押しではなく、下の管理欄から削除できます。</p><details><summary>お気に入りを管理</summary><div id="manage" class="saved" style="margin-top:12px"></div></details></section><section class="panel"><label for="keyword">キーワード（空欄なら全投稿）</label><input id="keyword" placeholder="例：グッズ OR イベント"><label>検索期間</label><div class="chips" id="periods"></div><div class="two" style="margin-top:12px"><div><label for="since">開始日</label><input id="since" type="date"></div><div><label for="until">終了日（含む）</label><input id="until" type="date"></div></div><label for="type">ポストの種類</label><select id="type"><option value="">すべて</option><option value="filter:images">画像付き</option><option value="filter:videos">動画付き</option><option value="filter:links">リンク付き</option></select><label class="check"><input id="replies" type="checkbox">返信を除外する</label><button id="search" class="primary">Xで検索する ↗</button><details><summary>検索コマンドを確認・コピー</summary><code id="query"></code><button id="copy" class="secondary small" style="margin-top:9px">コピー</button></details></section><section class="panel"><strong>検索条件の保存</strong><div class="row" style="margin-top:12px"><input id="presetName" placeholder="例：公式の新商品情報"><button id="savePreset" class="secondary">保存</button></div><div id="presets" style="margin-top:12px"></div></section><footer><p>設定はこの端末のブラウザ内に保存されます。Xの検索機能を利用するため、ログインやX側の検索仕様によって結果が変わる場合があります。</p><p>ホーム画面に追加：Safariの共有ボタン →「ホーム画面に追加」。Web公開後のURLで追加してください。</p></footer></main><script>
const $=id=>document.getElementById(id), key='x-rakuchin-v1';let data={accounts:[],presets:[]};try{data={...data,...JSON.parse(localStorage.getItem(key)||'{}')}}catch{}const save=()=>localStorage.setItem(key,JSON.stringify(data));const pad=n=>String(n).padStart(2,'0'),fmt=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;function addDays(d,n){let a=new Date(d);a.setDate(a.getDate()+n);return a}function period(v){const today=new Date();if(v==='all'){$('since').value='';$('until').value=''}else if(v==='custom'){}else if(v==='today'){$('since').value=fmt(today);$('until').value=fmt(today)}else if(v==='yesterday'){$('since').value=fmt(addDays(today,-1));$('until').value=fmt(addDays(today,-1))}else{$('since').value=fmt(addDays(today,-(Number(v)-1)));$('until').value=fmt(today)}document.querySelectorAll('#periods button').forEach(b=>b.classList.toggle('active',b.dataset.period===v));update()}
for(const [v,name] of [['all','全期間'],['today','今日'],['yesterday','昨日'],['7','7日間'],['30','30日間'],['custom','自由指定']]){const b=document.createElement('button');b.className='chip';b.dataset.period=v;b.textContent=name;b.onclick=()=>period(v);$('periods').append(b)}function cleanHandle(v){return v.trim().replace(/^@/,'').replace(/^https?:\/\/(www\.)?(x|twitter)\.com\//i,'').split(/[/?#]/)[0]}function renderAccounts(){const a=$('accounts'),m=$('manage');a.replaceChildren();m.replaceChildren();for(const name of data.accounts){const b=document.createElement('button');b.className='chip';b.textContent='@'+name;b.onclick=()=>{$('handle').value=name;update();renderAccounts()};if(cleanHandle($('handle').value).toLowerCase()===name.toLowerCase())b.classList.add('active');a.append(b);const del=document.createElement('button');del.className='danger small';del.textContent='× @'+name;del.onclick=()=>{data.accounts=data.accounts.filter(x=>x!==name);save();renderAccounts()};m.append(del)}if(!data.accounts.length)a.textContent='まだ登録されていません'}$('add').onclick=()=>{const h=cleanHandle($('handle').value);if(!/^[A-Za-z0-9_]{1,15}$/.test(h)){alert('有効なXユーザー名を入力してください');return}if(!data.accounts.some(x=>x.toLowerCase()===h.toLowerCase()))data.accounts.push(h);save();renderAccounts()};function query(){let h=cleanHandle($('handle').value),q=[];if(h)q.push('from:'+h);if($('keyword').value.trim())q.push($('keyword').value.trim());if($('type').value)q.push($('type').value);if($('replies').checked)q.push('-filter:replies');if($('since').value)q.push('since:'+$('since').value);if($('until').value)q.push('until:'+fmt(addDays(new Date($('until').value+'T12:00:00'),1)));return q.join(' ')}function update(){$('query').textContent=query();renderAccounts()}$('search').onclick=()=>{let h=cleanHandle($('handle').value);if(!/^[A-Za-z0-9_]{1,15}$/.test(h)){alert('検索するアカウントを指定してください');return}if($('since').value&&$('until').value&&$('since').value>$('until').value){alert('開始日と終了日を確認してください');return}location.href='https://x.com/search?q='+encodeURIComponent(query())+'&f=live'};$('copy').onclick=async()=>{try{await navigator.clipboard.writeText(query());alert('コピーしました')}catch{prompt('検索コマンド',query())}};['handle','keyword','type','since','until','replies'].forEach(id=>$(id).addEventListener('input',()=>{if(id==='since'||id==='until')document.querySelectorAll('#periods button').forEach(b=>b.classList.toggle('active',b.dataset.period==='custom'));update()}));function renderPresets(){const root=$('presets');root.replaceChildren();if(!data.presets.length){root.textContent='保存した検索条件はありません';root.className='muted';return}root.className='';data.presets.forEach((p,i)=>{const r=document.createElement('div');r.className='row';r.style.marginTop='8px';const load=document.createElement('button');load.className='secondary';load.style.flex='1';load.textContent=p.name;load.onclick=()=>{for(const k of ['handle','keyword','type','since','until'])$(k).value=p[k]||'';$('replies').checked=!!p.replies;period('custom')};const del=document.createElement('button');del.className='danger small';del.textContent='削除';del.onclick=()=>{data.presets.splice(i,1);save();renderPresets()};r.append(load,del);root.append(r)})}$('savePreset').onclick=()=>{const name=$('presetName').value.trim();if(!name){alert('保存名を入力してください');return}data.presets.push({name,...Object.fromEntries(['handle','keyword','type','since','until'].map(k=>[k,$(k).value])),replies:$('replies').checked});save();$('presetName').value='';renderPresets()};period('all');renderPresets();
</script></body></html>
